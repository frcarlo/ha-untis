<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB224"/>
      <stop offset="1" stop-color="#F06A0F"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#F06A0F"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A2E00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- timetable card -->
  <g filter="url(#sh)">
    <rect x="92" y="118" width="328" height="300" rx="40" fill="#FFFFFF"/>
  </g>
  <!-- header strip -->
  <path d="M92 158a40 40 0 0 1 40-40h248a40 40 0 0 1 40 40v22H92z" fill="#3A2A1F"/>
  <!-- binder rings -->
  <rect x="160" y="92" width="24" height="56" rx="12" fill="#FFFFFF"/>
  <rect x="328" y="92" width="24" height="56" rx="12" fill="#FFFFFF"/>

  <!-- lessons grid: 3 days x 3 periods -->
  <g fill="#FCD7AC">
    <rect x="124" y="208" width="76" height="52" rx="14"/>
    <rect x="218" y="208" width="76" height="52" rx="14"/>
    <rect x="312" y="208" width="76" height="52" rx="14"/>
    <rect x="124" y="276" width="76" height="52" rx="14"/>
    <rect x="312" y="276" width="76" height="52" rx="14"/>
    <rect x="124" y="344" width="76" height="52" rx="14"/>
    <rect x="218" y="344" width="76" height="52" rx="14"/>
  </g>
  <!-- current lesson -->
  <rect x="218" y="276" width="76" height="52" rx="14" fill="url(#hl)"/>
  <!-- cancelled lesson -->
  <rect x="312" y="344" width="76" height="52" rx="14" fill="none" stroke="#E5484D" stroke-width="6" stroke-dasharray="10 8"/>
  <path d="M336 356l28 28M364 356l-28 28" stroke="#E5484D" stroke-width="8" stroke-linecap="round"/>
</svg>
